; Rebucca 容器进程管理（supervisord 以 root 运行，具体程序降权为 rebucca）
[unix_http_server]
file=/tmp/supervisord.sock

[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisord.sock

; Django 应用（runserver 单进程，容器内无需文件热更新）
; ZLMediaKit 由应用 autoStartMedia=true 自举启动；分析由用户在「布控管理」手动启动
[program:django]
command=/opt/venv/bin/python manage.py runserver --noreload 0.0.0.0:10001
directory=/app
user=rebucca
environment=RUN_MAIN="true"
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/django.out.log
stderr_logfile=/tmp/django.err.log
