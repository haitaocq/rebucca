# Rebucca 容器编排（单镜像：应用 + ZLMediaKit + FFmpeg）
# 用法: docker compose up -d --build
# 访问: http://<host>:10001   默认账号 admin / admin888
#
# 端口说明（映射仅影响“外部能否访问”，容器内各服务走内部网络）:
#   - 最小可用：仅需 10001（Web 管理），应用通过容器内 localhost 调 ZLM API
#   - 外部拉流：再映射 10002(FLV/HLS)/10554(RTSP)/10935(RTMP)
#   - GB28181 接入：需 15060/udp(SIP) + 30001(及 /udp)
services:
  rebucca:
    build:
      context: .
      dockerfile: Dockerfile
    image: rebucca:1.002
    container_name: rebucca
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "10001:10001"        # Rebucca Web 管理后台（必须）
      - "10002:10002"        # ZLM HTTP 服务：管理 API + HTTP-FLV/HLS 播放
      - "10554:10554"        # ZLM RTSP 拉流（VLC/播放器/录像）
      - "10935:10935"        # ZLM RTMP 拉流/推流
      - "30001:30001"        # ZLM RTP 代理（GB28181 设备 RTP 推送，TCP 传输）
      - "30001:30001/udp"    # GB28181 设备 UDP 推流；多路并发时还可能用到 rtp_proxy.port_range 30002-40000
      - "15060:15060/udp"    # GB28181 SIP 注册
    volumes:
      - rebucca_db:/app/db                 # sqlite 数据库
      - rebucca_upload:/app/static/upload  # 模型权重上传
      - rebucca_storage:/app/static/storage # 录像/报警快照
      - rebucca_log:/app/log               # 运行日志
    # OpenCV 与多进程共享内存需要较大 /dev/shm（默认仅 64MB）
    shm_size: "1g"
    # 健康检查已定义在 Dockerfile（避免双份配置，此处不覆盖）

volumes:
  rebucca_db:
  rebucca_upload:
  rebucca_storage:
  rebucca_log:
